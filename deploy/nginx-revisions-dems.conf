# /etc/nginx/sites-available/revisions-dems.nucleatlas.org
server {
    listen 80;
    listen [::]:80;
    server_name revisions-dems.nucleatlas.org;

    root /var/www/revisions-dems;
    index index.html;

    # Accès privé : identifiant + mot de passe (fichier /etc/nginx/.htpasswd-revisions-dems)
    auth_basic           "Révision DEMS - accès privé";
    auth_basic_user_file /etc/nginx/.htpasswd-revisions-dems;

    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;
    gzip_min_length 1024;

    types { application/manifest+json webmanifest; }

    location = /sw.js { add_header Cache-Control "no-cache, no-store, must-revalidate"; add_header X-Robots-Tag "noindex, nofollow" always; }
    location = /manifest.webmanifest { add_header Cache-Control "no-cache"; }
    location = / { add_header Cache-Control "no-cache"; try_files /index.html =404; }
    location = /index.html { add_header Cache-Control "no-cache"; }
    location /fichiers/ { add_header Cache-Control "public, max-age=600, stale-while-revalidate=86400"; add_header X-Robots-Tag "noindex, nofollow" always; }

    location / { try_files $uri $uri/ =404; }
}
